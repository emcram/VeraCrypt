name: Build VeraCrypt

on:
  push:
    tags:
      - "gl-veracrypt-v*-cli"
      - "gl-veracrypt-v*-gui"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode (cli or gui)"
        type: choice
        required: true
        options:
          - cli
          - gui
        default: cli
      version:
        description: "Package version (e.g. 0.26.0)"
        required: true

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.tag.outputs.package_version }}
      build_mode: ${{ steps.tag.outputs.build_mode }}
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout shared actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 0r4m3r/gh-actions
          ref: cb94603482e9b8e476f9c93755f77674e16423e2
          path: .github/actions/gh-actions
          persist-credentials: false
          fetch-depth: 1

      - name: Ensure tag is on mcr/release
        if: startsWith(github.ref, 'refs/tags/gl-')
        uses: ./.github/actions/gh-actions/require-release-tip
        with:
          release_branch: mcr/release
          allow_merge_commits: "true"

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "${TAG}" =~ ^gl-veracrypt-v([0-9]+\.[0-9]+\.[0-9]+)(-r[0-9]+)?-(cli|gui)$ ]]; then
              echo "Invalid tag: ${TAG}. Expected gl-veracrypt-v<semver>-(cli|gui), e.g. gl-veracrypt-v0.26.0-cli." >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            mode="${BASH_REMATCH[3]}"
          else
            version="${{ inputs.version }}"
            mode="${{ inputs.build_mode }}"
            if [[ -z "${version}" ]]; then
              echo "version input is required for workflow_dispatch." >&2
              exit 1
            fi
            TAG="manual-${version}-${mode}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "package_version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_mode=${mode}" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build VeraCrypt (linux)
    runs-on: ubuntu-24.04
    needs: setup
    timeout-minutes: 90
    env:
      WXWIDGETS_VERSION: 3.2.5
      PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
      BUILD_MODE: ${{ needs.setup.outputs.build_mode }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential yasm pkg-config libpcsclite-dev libfuse-dev cmake debhelper \
            wget tar bzip2 ca-certificates nodejs npm
          sudo rm -rf /var/lib/apt/lists/*
          if [ "${BUILD_MODE}" = "gui" ]; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev
            sudo rm -rf /var/lib/apt/lists/*
          fi

      - name: Validate translations XML
        run: |
          sudo npm install -g fast-xml-parser@4.5.2
          ./.github/workflows/xmlvalidate.sh "${GITHUB_WORKSPACE}"

      - name: Download wxWidgets
        run: |
          wx_tar="/tmp/wxWidgets-${WXWIDGETS_VERSION}.tar.bz2"
          if [ ! -d "/tmp/wxWidgets-${WXWIDGETS_VERSION}" ]; then
            wget -O "${wx_tar}" "https://github.com/wxWidgets/wxWidgets/releases/download/v${WXWIDGETS_VERSION}/wxWidgets-${WXWIDGETS_VERSION}.tar.bz2"
            mkdir -p "/tmp/wxWidgets-${WXWIDGETS_VERSION}"
            tar -xjf "${wx_tar}" -C "/tmp/wxWidgets-${WXWIDGETS_VERSION}" --strip-components=1
          fi

      - name: Build VeraCrypt .deb package
        run: |
          case "${BUILD_MODE}" in
            cli)
              make -C src WXSTATIC=1 NOGUI=1 WX_ROOT="/tmp/wxWidgets-${WXWIDGETS_VERSION}" WX_BUILD_DIR="/tmp/wxBuildConsole" wxbuild
              make -C src WXSTATIC=1 NOGUI=1 WX_ROOT="/tmp/wxWidgets-${WXWIDGETS_VERSION}" WX_BUILD_DIR="/tmp/wxBuildConsole" clean
              make -C src WXSTATIC=1 NOGUI=1 WX_ROOT="/tmp/wxWidgets-${WXWIDGETS_VERSION}" WX_BUILD_DIR="/tmp/wxBuildConsole"
              make -C src WXSTATIC=1 NOGUI=1 WX_ROOT="/tmp/wxWidgets-${WXWIDGETS_VERSION}" WX_BUILD_DIR="/tmp/wxBuildConsole" install DESTDIR="/tmp/VeraCrypt_Setup/Console"
              cmake -H"${GITHUB_WORKSPACE}/src/Build" -B"/tmp/VeraCrypt_Packaging/Console" -DVERACRYPT_BUILD_DIR="/tmp/VeraCrypt_Setup/Console" -DNOGUI=TRUE
              cpack --config /tmp/VeraCrypt_Packaging/Console/CPackConfig.cmake
              ;;
            gui)
              make -C src WXSTATIC=1 WX_ROOT="/tmp/wxWidgets-${WXWIDGETS_VERSION}" WX_BUILD_DIR="/tmp/wxBuildGui" wxbuild
              make -C src WXSTATIC=1 WX_ROOT="/tmp/wxWidgets-${WXWIDGETS_VERSION}" WX_BUILD_DIR="/tmp/wxBuildGui" clean
              make -C src WXSTATIC=1 WX_ROOT="/tmp/wxWidgets-${WXWIDGETS_VERSION}" WX_BUILD_DIR="/tmp/wxBuildGui"
              make -C src WXSTATIC=1 WX_ROOT="/tmp/wxWidgets-${WXWIDGETS_VERSION}" WX_BUILD_DIR="/tmp/wxBuildGui" install DESTDIR="/tmp/VeraCrypt_Setup/GUI"
              cmake -H"${GITHUB_WORKSPACE}/src/Build" -B"/tmp/VeraCrypt_Packaging/GUI" -DVERACRYPT_BUILD_DIR="/tmp/VeraCrypt_Setup/GUI" -DNOGUI=FALSE
              cpack --config /tmp/VeraCrypt_Packaging/GUI/CPackConfig.cmake
              ;;
            *)
              echo "Unsupported BUILD_MODE: ${BUILD_MODE}. Use 'cli' or 'gui'." >&2
              exit 1
              ;;
          esac

      - name: Collect artifacts
        run: |
          case "${BUILD_MODE}" in
            cli)
              mkdir -p artifacts/console
              cp /tmp/VeraCrypt_Packaging/Console/Packaging/veracrypt-console-* artifacts/console/
              (cd artifacts && sha256sum console/* > "veracrypt-cli-sha256-checksums-${PACKAGE_VERSION}.txt")
              ;;
            gui)
              mkdir -p artifacts/gui
              cp /tmp/VeraCrypt_Packaging/GUI/Packaging/veracrypt-* artifacts/gui/
              (cd artifacts && sha256sum gui/* > "veracrypt-gui-sha256-checksums-${PACKAGE_VERSION}.txt")
              ;;
            *)
              echo "Unsupported BUILD_MODE: ${BUILD_MODE}. Use 'cli' or 'gui'." >&2
              exit 1
              ;;
          esac

      - name: Install and test VeraCrypt package
        run: |
          sudo apt-get update -y
          case "${BUILD_MODE}" in
            cli)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./artifacts/console/*.deb
              veracrypt --test && veracrypt --version
              ;;
            gui)
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./artifacts/gui/*.deb
              veracrypt --text --test && veracrypt --text --version
              ;;
            *)
              echo "Unsupported BUILD_MODE: ${BUILD_MODE}. Use 'cli' or 'gui'." >&2
              exit 1
              ;;
          esac
          sudo veracrypt --non-interactive Tests/test.sha256.hc --hash sha256 --slot 1 --password test --mount-options=ro
          sudo veracrypt --non-interactive Tests/test.sha512.hc --hash sha512 --slot 2 --password test --mount-options=ro
          sudo veracrypt --non-interactive Tests/test.streebog.hc --hash streebog --slot 3 --password test --mount-options=ro
          sudo veracrypt --non-interactive Tests/test.whirlpool.hc --hash whirlpool --slot 4 --password test --mount-options=ro
          sudo veracrypt --list
          echo -n "Dummy" > /tmp/expected_content.txt
          if cmp -s /media/veracrypt1/dummy.txt /tmp/expected_content.txt; then
            echo "Content of test.sha256.hc is valid."
          else
            echo "Content of test.sha256.hc is invalid!"
            exit 1
          fi
          if cmp -s /media/veracrypt2/dummy.txt /tmp/expected_content.txt; then
            echo "Content of test.sha512.hc is valid."
          else
            echo "Content of test.sha512.hc is invalid!"
            exit 1
          fi
          if cmp -s /media/veracrypt3/dummy.txt /tmp/expected_content.txt; then
            echo "Content of test.streebog.hc is valid."
          else
            echo "Content of test.streebog.hc is invalid!"
            exit 1
          fi
          if cmp -s /media/veracrypt4/dummy.txt /tmp/expected_content.txt; then
            echo "Content of test.whirlpool.hc is valid."
          else
            echo "Content of test.whirlpool.hc is invalid!"
            exit 1
          fi
          sudo veracrypt -d
          if [ "${BUILD_MODE}" = "cli" ]; then
            sudo apt-get remove -y veracrypt-console
          else
            sudo apt-get remove -y veracrypt
          fi

      - name: Upload CLI artifacts
        if: env.BUILD_MODE == 'cli'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: veracrypt-cli-debs-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/console/*.deb
            artifacts/veracrypt-cli-sha256-checksums-${{ env.PACKAGE_VERSION }}.txt
          if-no-files-found: error

      - name: Upload GUI artifacts
        if: env.BUILD_MODE == 'gui'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: veracrypt-gui-debs-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/gui/*.deb
            artifacts/veracrypt-gui-sha256-checksums-${{ env.PACKAGE_VERSION }}.txt
          if-no-files-found: error
