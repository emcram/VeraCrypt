name: Release VeraCrypt

on:
  workflow_run:
    workflows: ["Build VeraCrypt"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub release (linux)
    runs-on: ubuntu-24.04
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'gl-veracrypt-v')
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          if [[ ! "${TAG}" =~ ^gl-veracrypt-v([0-9]+\.[0-9]+\.[0-9]+)(-r[0-9]+)?-(cli|gui)$ ]]; then
            echo "Unexpected tag ${TAG}. Expected gl-veracrypt-v<semver>-(cli|gui)." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          version="${BASH_REMATCH[1]}"
          mode="${BASH_REMATCH[3]}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          if [ "${mode}" = "cli" ]; then
            artifact_dir="console"
          else
            artifact_dir="gui"
          fi
          echo "artifact_prefix=veracrypt-${mode}-debs-${version}" >> "$GITHUB_OUTPUT"
          echo "artifact_dir=${artifact_dir}" >> "$GITHUB_OUTPUT"
          echo "checksum=packages/artifacts/veracrypt-${mode}-sha256-checksums-${version}.txt" >> "$GITHUB_OUTPUT"
          echo "artifacts=packages/artifacts/${artifact_dir}/*.deb,packages/artifacts/veracrypt-${mode}-sha256-checksums-${version}.txt" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          api="https://api.github.com/repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts"
          resp="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}")"
          artifact_url="$(printf '%s' "${resp}" | python3 -c "import json,sys; data=json.load(sys.stdin); prefix='${{ steps.tag.outputs.artifact_prefix }}'; url=next((a['archive_download_url'] for a in data.get('artifacts', []) if (not a.get('expired') and a.get('name','').startswith(prefix))), ''); print(url)")" || {
            echo "No artifacts found for run ${RUN_ID}." >&2
            echo "${resp}" >&2
            exit 1
          }
          mkdir -p packages
          curl -sS -L -H "Authorization: Bearer ${GH_TOKEN}" -o /tmp/artifact.zip "${artifact_url}"
          unzip -q /tmp/artifact.zip -d packages

      - name: Verify artifacts
        run: |
          ls -la packages
          test -f "${{ steps.tag.outputs.checksum }}"
          ls packages/artifacts/${{ steps.tag.outputs.artifact_dir }}/*.deb

      - name: Create GitHub release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          artifacts: ${{ steps.tag.outputs.artifacts }}
          tag: ${{ steps.tag.outputs.tag }}
          name: VeraCrypt ${{ steps.tag.outputs.version }}
          generateReleaseNotes: true
          draft: false
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
